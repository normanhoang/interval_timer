name: IntervalTimer
options:
  bundleIdPrefix: com.normanhoang
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "DZRPJF9JB6"
    CODE_SIGN_STYLE: Automatic

targets:
  IntervalTimer:
    type: application
    platform: iOS
    sources:
      - path: IntervalTimer
    dependencies:
      - target: IntervalTimerWatch
      - target: IntervalTimerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.intervaltimer
        INFOPLIST_FILE: IntervalTimer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  # WidgetKit extension: the run's Live Activity (lock screen + Dynamic Island).
  IntervalTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: IntervalTimerWidgets
      - path: IntervalTimer/LiveActivity/RunActivityAttributes.swift
      - path: IntervalTimer/Theme/Palette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.intervaltimer.widgets
        INFOPLIST_FILE: IntervalTimerWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  # Watch companion: shares the portable model/engine/theme/audio sources.
  IntervalTimerWatch:
    type: application
    platform: watchOS
    sources:
      - path: IntervalTimerWatch
      - path: IntervalTimer/Models/Workout.swift
      - path: IntervalTimer/Engine
      - path: IntervalTimer/Theme
      - path: IntervalTimer/Audio/Cues.swift
      - path: IntervalTimer/Audio/AlertSounds.swift
      - path: IntervalTimer/Stores/Settings.swift
      - path: IntervalTimer/Util/Encouragements.swift
      - path: IntervalTimer/Sync
      - path: IntervalTimer/Resources/Sounds
        buildPhase: resources
    entitlements:
      path: IntervalTimerWatch/IntervalTimerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.intervaltimer.watchkitapp
        INFOPLIST_FILE: IntervalTimerWatch/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  IntervalTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntervalTimerTests
    dependencies:
      - target: IntervalTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.intervaltimer.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  IntervalTimer:
    build:
      targets:
        IntervalTimer: all
        IntervalTimerTests: [test]
    run:
      config: Debug
    test:
      targets:
        - IntervalTimerTests

  IntervalTimerWatch:
    build:
      targets:
        IntervalTimerWatch: all
    run:
      config: Debug
