name: IntervalTimer
options:
  bundleIdPrefix: com.normanhoang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "DZRPJF9JB6"
    CODE_SIGN_STYLE: Automatic

targets:
  IntervalTimer:
    type: application
    platform: iOS
    sources:
      - path: IntervalTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.intervaltimer
        INFOPLIST_FILE: IntervalTimer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  IntervalTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntervalTimerTests
    dependencies:
      - target: IntervalTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.intervaltimer.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  IntervalTimer:
    build:
      targets:
        IntervalTimer: all
        IntervalTimerTests: [test]
    run:
      config: Debug
    test:
      targets:
        - IntervalTimerTests
